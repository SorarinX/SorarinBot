    <title>SorarinBot 控制台</title>
    <script>
      // 在首屏渲染前恢复主题，避免亮/暗闪烁。
      // 首次访问（无存储）固定深色，不跟随系统；仅显式选择 light 时保持浅色。
      (function () {
        var dark = true;
        try {
          var stored = localStorage.getItem("sorarin-theme");
          dark = stored !== "light";
        } catch (error) {
          dark = true;
        }
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
