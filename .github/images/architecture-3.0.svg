<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="SorarinBot architecture: WeChat and the browser talk to one static Go binary, which calls an OpenAI-compatible model and stores history in SQLite.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3E5A50"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="520" rx="24" fill="#0B0F0E"/>
  <rect x="0.75" y="0.75" width="998.5" height="518.5" rx="23.25" fill="none" stroke="#202823"/>

  <text x="40" y="47" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#13E0BC">SorarinBot</text>
  <text x="40" y="69" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#8C9992">one static Go binary &#183; no runtime dependencies</text>

  <rect x="110" y="96" width="240" height="78" rx="14" fill="#151B18" stroke="#2A332E"/>
  <text x="230" y="126" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="14.5" font-weight="600" fill="#E9EDEB">WeChat</text>
  <text x="230" y="147" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#93A09A">private chat &#183; group @ &#183; pat-pat</text>

  <rect x="650" y="96" width="240" height="78" rx="14" fill="#151B18" stroke="#2A332E"/>
  <text x="770" y="126" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="14.5" font-weight="600" fill="#E9EDEB">Browser / Electron</text>
  <text x="770" y="147" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#93A09A">React console &#183; localhost:8080</text>

  <rect x="50" y="206" width="900" height="150" rx="18" fill="#101512" stroke="#29332D"/>
  <text x="70" y="230" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" letter-spacing="1.2" fill="#13E0BC">ONE STATIC GO BINARY</text>
  <text x="70" y="246" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#7F8C85">no external services &#183; pure-Go SQLite</text>

  <rect x="80" y="260" width="195" height="76" rx="12" fill="#171D1A" stroke="#2E3832"/>
  <text x="177" y="290" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#E9EDEB">WeChat adapter</text>
  <text x="177" y="310" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#93A09A">openwechat fork &#183; 6-state login</text>

  <rect x="305" y="260" width="195" height="76" rx="12" fill="#171D1A" stroke="#2E3832"/>
  <text x="402" y="290" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#E9EDEB">Message handler</text>
  <text x="402" y="310" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#93A09A">context &#183; vision &#183; dedup</text>

  <rect x="530" y="260" width="195" height="76" rx="12" fill="#171D1A" stroke="#2E3832"/>
  <text x="627" y="290" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#E9EDEB">Session manager</text>
  <text x="627" y="310" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#93A09A">serial worker &#183; queue 16</text>

  <rect x="755" y="260" width="195" height="76" rx="12" fill="#171D1A" stroke="#2E3832"/>
  <text x="852" y="290" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#E9EDEB">HTTP + React</text>
  <text x="852" y="310" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#93A09A">net/http &#183; go:embed SPA</text>

  <rect x="305" y="400" width="195" height="76" rx="12" fill="#151B18" stroke="#2A332E"/>
  <text x="402" y="430" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#E9EDEB">LLM provider</text>
  <text x="402" y="450" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#93A09A">OpenAI-compatible API</text>

  <rect x="530" y="400" width="195" height="76" rx="12" fill="#151B18" stroke="#2A332E"/>
  <text x="627" y="430" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#E9EDEB">SQLite</text>
  <text x="627" y="450" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#93A09A">history &#183; logs &#183; sessions</text>

  <path d="M230 174 C230 214 177 214 177 258" fill="none" stroke="#3E5A50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M770 174 C770 214 852 214 852 258" fill="none" stroke="#3E5A50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M275 298 L303 298" fill="none" stroke="#3E5A50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M500 298 L528 298" fill="none" stroke="#3E5A50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M402 338 L402 398" fill="none" stroke="#3E5A50" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M627 338 L627 398" fill="none" stroke="#3E5A50" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="492" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="9.5" fill="#6E7B75">one process &#183; WeChat and the console meet in the same binary</text>
</svg>
